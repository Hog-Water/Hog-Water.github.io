name: Materialize MAKE A FOOL catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-make-a-fool-catalog.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6

      - name: Reassemble and verify exact catalog
        shell: bash
        run: |
          set -euo pipefail

          cat \
            BorkBorg/generated/catalog.json.gz.b64.01 \
            BorkBorg/generated/catalog.json.gz.b64.02 \
            BorkBorg/generated/catalog.json.gz.b64.03 \
            BorkBorg/generated/catalog.json.gz.b64.04 \
            | base64 --decode \
            | gzip --decompress --stdout \
            > BorkBorg/generated/catalog.json

          expected_sha256='93e9a8457da377efd2ca1b79a4bddde5125a1a40fa28d7112581e36ec5364e1b'
          actual_sha256="$(sha256sum BorkBorg/generated/catalog.json | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"

          expected_git_blob='b89e00d56f87f6f03ed53db14a2c978f46aacd1f'
          actual_git_blob="$(git hash-object BorkBorg/generated/catalog.json)"
          test "$actual_git_blob" = "$expected_git_blob"

          rm -f \
            BorkBorg/generated/catalog.b64.01 \
            BorkBorg/generated/catalog.b64.02 \
            BorkBorg/generated/catalog.json.gz.b64.01 \
            BorkBorg/generated/catalog.json.gz.b64.02 \
            BorkBorg/generated/catalog.json.gz.b64.03 \
            BorkBorg/generated/catalog.json.gz.b64.04

      - name: Commit materialized deployment file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BorkBorg/generated/catalog.json BorkBorg/generated/
          git commit -m 'Materialize exact MAKE A FOOL catalog'
          git push
